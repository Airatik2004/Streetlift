name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (если заданы секреты)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release будет подписан вашим ключом"
          else
            echo "Секретов нет — release подпишется debug-ключом"
          fi

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug + release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: streetlift-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: streetlift-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Print DB schemas (base64)
        run: |
          for f in $(find app/schemas -name '*.json' | sort); do
            echo "SCHEMA_FILE $f $(base64 -w0 "$f")"
          done

      - name: Upload DB schemas
        uses: actions/upload-artifact@v4
        with:
          name: db-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish APK to Releases (latest)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk streetlift.apk
          TAG="build-${{ github.run_number }}"
          # Свой тег на каждую сборку: повторно использовать удалённый тег GitHub не даёт
          # (релиз остаётся черновиком). Ссылка /releases/latest/download/... ведёт на последний.
          gh release delete latest --yes || true
          gh release create "$TAG" streetlift.apk --target "$GITHUB_SHA" \
            --title "Тренировки — сборка ${{ github.run_number }}" \
            --notes "Автосборка из ${GITHUB_SHA::7}. Прямая ссылка: https://github.com/${{ github.repository }}/releases/latest/download/streetlift.apk" \
            --latest
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json isDraft,url
